[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-moment-integration"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "Pillow>=10", "torch>=2.2,<3", "scikit-image>=0.22", "pytest>=8"]

[project.scripts]
jm = "jm.cli:main"

[tool.setuptools.packages.find]
include = ["jm*"]
